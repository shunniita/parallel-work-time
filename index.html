<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <!--
      主対象は画面幅1280px以上のPC（仕様書12.1）だが、幅を1280へ固定しない。
      固定すると layout.css の狭幅対応（max-width: 1279px）が実機で発火せず、
      狭い画面では横スクロールしないと操作できなくなる。仕様書13章は
      「狭い画面でも操作不能な崩壊を避ける」と定めている（レビュー指摘 D-19）。
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>同時並行作業時間計測支援ツール</title>
    <!--
      外部フォント・CDN・外部APIを参照しない（仕様書5.1.4、13章）。
      このファイルと src/ 配下に外部URLの文字列が無いことを T-18 で静的検査する。
    -->
    <link rel="stylesheet" href="src/styles/base.css" />
    <link rel="stylesheet" href="src/styles/layout.css" />
    <link rel="stylesheet" href="src/styles/components.css" />
  </head>
  <body>
    <!-- 骨格は src/ui/shell.js が組み立てる（仕様書12.1）。 -->
    <div id="app">
      <p data-testid="boot-message">初期化中…</p>
    </div>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
